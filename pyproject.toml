[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlphonon"
version = "0.1.0"
description = "DFT-referenced MLIP workflow for phonon properties and thermal transport"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Benz Ma" }]
dependencies = [
  "ase>=3.23",
  "h5py>=3.10",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "phonopy>=2.30",
  "phono3py>=3.0",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "spglib>=2.4",
]

[project.optional-dependencies]
mace = ["mace-torch>=0.3.10"]
kaldo-ifc = ["kaldo>=2.0"]

[project.scripts]
mlphonon-validate = "mlphonon.cli:validate_main"

[tool.setuptools]
packages = ["mlphonon"]
